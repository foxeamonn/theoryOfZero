<script>
   

function calcWork()
{
    const F1 = +document.getElementById("effortForce").value;
    let d1 = +document.getElementById("effortArm").value;
    let d2;
    const F2 = +document.getElementById("loadForce").value;
    const ratio = F1 / F2;
    console.log(ratio);
    let htmlCode = "<table border=1><th>F1</th><th>d1</th><th>F2<th>d2</th>";
   do {
        d2 = d1 * ratio;
        htmlCode += "<tr><td>"+F1.toFixed(2)+"</td><td>"+d1.toFixed(2)+"</td><td>"+F2.toFixed(2)+"</td><td>"+d2.toFixed(2)+"</td></tr>";
       
        d1 += 1;
   } while (d1 < 5);
    
    htmlCode += "</table>";
    document.getElementById("show").innerHTML = htmlCode;
}

    
</script>

<div id = "show">
  
</div>
<script>
    let htmlCode = "<table border=1><th>p.e</th><th>k.e</th><th>gradient (k)</th><th>Gradient(f)</th><th>angle</th>";
   
    
    let pe = 1;
    let ke = 1;
    let gradientk = 1;
    let gradientf = 1;
    let theata = Math.atan(ke/pe);
    const area = 1;

    do{
        ke = area / pe;
        ke = ke.toFixed(4);
       
        gradientk = (ke / pe) *-1;
        gradientk = gradientk.toFixed(4);
        gradientf = (1/Math.pow(pe, 2))*-1;
        gradientf = gradientf.toFixed(4);
        theata = Math.atan(ke/pe);
        theata = theata.toFixed(4);
        htmlCode += `
        <tr>
            <td>${pe}</td>
            <td>${ke}</td>
            <td>${gradientk}</td>
            <td>${gradientf}</td>
            <td>${theata}</td>
        </tr>
        ` 
       
        pe += 1;

    }while (pe <= 10)
     htmlCode += "</table>";
     document.getElementById("show").innerHTML = htmlCode;
</script>
